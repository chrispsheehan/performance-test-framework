services:

  mock:
    build:
      context: ./mock
    container_name: mock
    volumes:
      - ./state/state.json:/state.json
    ports: 
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      retries: 5
      timeout: 2s
    networks: 
      - mockservice

  k6-runner:
    depends_on:
      mock:
        condition: service_healthy
    image: grafana/k6:latest
    platform: linux/x86_64
    container_name: k6-runner
    volumes:
      - ./dist:/dist
    command: run /dist/tests.js --config /dist/options/smoke.json --http-debug
    environment:
      - APP_DOMAIN=http://mock:8080      
    networks: 
      - mockservice        

networks:
    mockservice:
        name: mockservice    
